<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:transparent} svg{display:block} #mono{filter:brightness(0) invert(1)}</style></head><body>
<!-- Icône Olipingo « les trois anneaux » (27/11/2026) : marche (bleu), renfo (violet), repas (vert), en boudins sur fond sable.
     Calques d'icône adaptative Android (108 × 108, zone sûre : cercle de rayon 33 au centre) rendus par render.js. -->
<svg width="0" height="0" style="position:absolute"><defs>
<linearGradient id="gW" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9DB8FF"/><stop offset="1" stop-color="#4C7DFF"/></linearGradient>
<linearGradient id="gK" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D2BBFF"/><stop offset="1" stop-color="#9468F0"/></linearGradient>
<linearGradient id="gF" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D3E68F"/><stop offset="1" stop-color="#7FA62E"/></linearGradient>
<radialGradient id="sand" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#F6EEE2"/><stop offset="1" stop-color="#E6D9C6"/></radialGradient>
<filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="1.6" stdDeviation="1.6" flood-color="#5A3C1E" flood-opacity=".25"/></filter>
<symbol id="rings" viewBox="0 0 108 108">
  <g filter="url(#sh)" fill="none" stroke-linecap="round">
    <circle cx="54" cy="54" r="26" stroke="#E3D6C2" stroke-width="8.5"/>
    <circle cx="54" cy="54" r="26" stroke="url(#gW)" stroke-width="8.5" stroke-dasharray="122.5 163.4" transform="rotate(-90 54 54)"/>
    <circle cx="54" cy="54" r="23.9" stroke="#fff" stroke-opacity=".5" stroke-width="1.6" stroke-dasharray="110 150.2" transform="rotate(-90 54 54)"/>
    <circle cx="54" cy="54" r="16.5" stroke="#E3D6C2" stroke-width="7"/>
    <circle cx="54" cy="54" r="16.5" stroke="url(#gK)" stroke-width="7" stroke-dasharray="51.8 103.7" transform="rotate(-90 54 54)"/>
    <circle cx="54" cy="54" r="14.8" stroke="#fff" stroke-opacity=".5" stroke-width="1.3" stroke-dasharray="44 93" transform="rotate(-90 54 54)"/>
    <circle cx="54" cy="54" r="7.5" stroke="#E3D6C2" stroke-width="6.5"/>
    <circle cx="54" cy="54" r="7.5" stroke="url(#gF)" stroke-width="6.5" stroke-dasharray="32 47.1" transform="rotate(-90 54 54)"/>
  </g>
</symbol>
<symbol id="ringsMono" viewBox="0 0 108 108">
  <g fill="none" stroke="#000" stroke-linecap="round">
    <circle cx="54" cy="54" r="26" stroke-width="8.5" stroke-dasharray="122.5 163.4" transform="rotate(-90 54 54)"/>
    <circle cx="54" cy="54" r="16.5" stroke-width="7" stroke-dasharray="51.8 103.7" transform="rotate(-90 54 54)"/>
    <circle cx="54" cy="54" r="7.5" stroke-width="6.5" stroke-dasharray="32 47.1" transform="rotate(-90 54 54)"/>
  </g>
</symbol>
</defs></svg>
<svg id="bg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="432" height="432"><rect width="108" height="108" fill="url(#sand)"/></svg>
<svg id="fg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="432" height="432"><use href="#rings" width="108" height="108"/></svg>
<div id="mono"><svg id="fgm" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="432" height="432"><use href="#ringsMono" width="108" height="108"/></svg></div>
<div id="legacy" style="width:432px;height:432px;position:relative;border-radius:96px;overflow:hidden">
  <svg viewBox="0 0 108 108" width="432" height="432"><rect width="108" height="108" fill="url(#sand)"/><g transform="translate(-10.8 -10.8) scale(1.2)"><use href="#rings" width="108" height="108"/></g></svg>
</div>
</body></html>
