name: Build and release
# Builds the signed APK on every push. When app/build.gradle has a versionName with no release yet,
# publishes release v<versionName> with the APK; the installed app finds it and offers to update.
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(grep -oP "versionName '\K[^']+" app/build.gradle)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build the release APK, signed with the private key from the repo secrets
        env:
          OLIPINGO_KEYSTORE_B64: ${{ secrets.OLIPINGO_KEYSTORE_B64 }}
          OLIPINGO_KEYSTORE_PASSWORD: ${{ secrets.OLIPINGO_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$OLIPINGO_KEYSTORE_B64" ] || [ -z "$OLIPINGO_KEYSTORE_PASSWORD" ]; then
            echo "::error::Secrets OLIPINGO_KEYSTORE_B64 and OLIPINGO_KEYSTORE_PASSWORD are missing. Never release an unsigned or debug-signed APK."
            exit 1
          fi
          export OLIPINGO_KEYSTORE="$RUNNER_TEMP/olipingo-release.p12"
          echo "$OLIPINGO_KEYSTORE_B64" | base64 -d > "$OLIPINGO_KEYSTORE"
          gradle assembleRelease --no-daemon
          rm -f "$OLIPINGO_KEYSTORE"
      - name: Check the signature (same certificate on every release)
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee certs.txt
          grep -q "SHA-256 digest" certs.txt
      - run: cp app/build/outputs/apk/release/app-release.apk "olipingo-${{ steps.v.outputs.version }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: olipingo-apk
          path: olipingo-${{ steps.v.outputs.version }}.apk
      - name: Release if this version is new
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          if gh release view "v$V" >/dev/null 2>&1; then echo "v$V already released"; exit 0; fi
          awk -v v="## $V" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.txt
          gh release create "v$V" "olipingo-$V.apk" --target "$GITHUB_SHA" --title "Olipingo $V" --notes-file notes.txt
